<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLDV 2026 | Dashboard</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17233b;background:#f4f7fb;--blue:#1769e0;--blue2:#2f80ed;--navy:#0d3b73;--ink:#17233b;--muted:#6d7b91;--line:#e4eaf2;--card:#fff;--soft:#eef5ff;--green:#16804a;--red:#c63a3a;--shadow:0 8px 28px rgba(25,55,95,.07)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7faff 0,#f4f7fb 42%,#eef3f9 100%)}button,input,select{font:inherit}
.login-page{min-height:100vh;background:radial-gradient(circle at 20% 10%,#dcecff 0,transparent 35%),linear-gradient(135deg,#edf5ff,#f9fbff 60%,#eef4fb);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(460px,100%);background:#fff;border:1px solid #dfe8f3;border-radius:26px;box-shadow:0 24px 70px rgba(18,60,110,.16);overflow:hidden}.login-head{padding:34px 34px 20px;text-align:center}.logo{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#e9f2ff,#dcecff);color:var(--blue);display:grid;place-items:center;font-size:24px;font-weight:900;margin:0 auto 15px}.org{font-size:12px;font-weight:850;letter-spacing:.35px;color:var(--navy);text-transform:uppercase}.title{font-size:26px;font-weight:900;margin:9px 0;color:#102442}.sub{font-size:14px;color:var(--muted);line-height:1.55}.login-body{padding:10px 34px 34px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px;color:#344054}.input,select{width:100%;padding:13px 14px;border:1px solid #d6dfeb;border-radius:12px;background:#fff;outline:none;transition:.2s}.input:focus,select:focus{border-color:#74a6eb;box-shadow:0 0 0 4px #1769e014}.password{position:relative}.password .input{padding-right:48px}.eye{position:absolute;right:8px;top:7px;border:0;background:transparent;padding:8px;color:#667085;cursor:pointer}.btn{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--blue);color:#fff;font-weight:800}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.login-btn{width:100%;margin-top:7px}.sso{width:100%;margin-top:10px;background:#fff;color:var(--navy);border:1px solid #d8e0ec}.or{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:12px;margin:17px 0}.or:before,.or:after{content:"";height:1px;background:#e8edf4;flex:1}.demo{font-size:11px;color:#98a2b3;text-align:center;margin-top:15px}.footer{text-align:center;font-size:11px;color:#98a2b3;padding:0 20px 22px}
.app{min-height:100vh}.topbar{height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.brandbox{display:flex;align-items:center;gap:12px}.brandmark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#e8f2ff,#dceaff);color:var(--blue);display:grid;place-items:center;font-weight:950;font-size:12px}.brandname{font-weight:900;color:var(--navy);font-size:17px}.brandsub{font-size:11px;color:#8491a5;margin-top:3px}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#e8f1ff;color:var(--blue);display:grid;place-items:center;font-weight:850}
.main{max-width:1500px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:20px}.hero h1{margin:0 0 7px;font-size:29px;letter-spacing:-.4px;color:#112746}.muted{color:var(--muted);font-size:13px;line-height:1.45}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.secondary{background:#eaf2ff;color:#175fc3}.secondary:hover{background:#e2edff}.danger{background:#fff0f0;color:#c43232}.nav{display:flex;gap:8px;margin:0 0 18px}.nav button{background:#fff;color:#475467;border:1px solid #dce4ee}.nav button.active{background:linear-gradient(135deg,#1e73ea,#1769e0);color:#fff;border-color:#1769e0;box-shadow:0 6px 15px #1769e026}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.filters{padding:14px;display:grid;grid-template-columns:2fr repeat(6,1fr) auto;gap:9px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.kpi{padding:19px;position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-35px;background:#eaf2ff}.kpi .ico{font-size:21px;position:relative;z-index:1}.kpi .muted{margin-top:5px}.kpi b{font-size:30px;display:block;margin-top:8px;color:#102a50;position:relative;z-index:1}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:24px 2px 10px}.section-title h2{font-size:18px;margin:0;color:#183253}.charts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:15px 0}.chart{padding:19px;min-height:310px}.chart h3{margin:0 0 4px;font-size:16px;color:#173153}.chart-head{display:flex;justify-content:space-between;align-items:start}.chart-total{font-size:12px;color:#718096}.bar{height:225px;display:flex;align-items:end;gap:12px;padding:28px 10px 34px;border-bottom:1px solid #edf1f6}.bar i{flex:1;background:linear-gradient(180deg,#4d91f4,#1769e0);border-radius:8px 8px 2px 2px;position:relative;min-width:25px;max-width:75px;transition:.2s;box-shadow:0 4px 10px #1769e01c}.bar i:hover{filter:brightness(1.06);transform:translateY(-2px)}.bar span{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#667085}.bar em{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:800;color:#183b68}.hbars{padding-top:12px}.hrow{display:grid;grid-template-columns:145px 1fr 48px;gap:10px;align-items:center;margin:12px 0}.hlabel{font-size:12px;font-weight:700;color:#42526a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:12px;border-radius:999px;background:#edf2f8;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#6ca7f7,#1769e0)}.hval{text-align:right;font-size:12px;font-weight:800;color:#173b69}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.legend .pill{background:#f4f7fb;color:#5b6b82}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf1f6;text-align:left;white-space:nowrap}.table th{background:#f8fafc;position:sticky;top:0;color:#475467;font-size:12px;text-transform:uppercase;letter-spacing:.25px}.table tr:hover td{background:#fbfdff}.alert{color:#b42318;background:#fff0ef}.ok{color:#147d43;background:#ecfdf3}.status,.pill{font-size:12px;padding:6px 10px;border-radius:999px;display:inline-block}.status.ok{font-weight:800}.report-note{display:flex;gap:10px;align-items:center;padding:15px 17px}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 15px;border-radius:11px;display:none;z-index:20;box-shadow:0 10px 30px #0002}
@media(max-width:1200px){.filters{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.topbar{padding:0 15px}.main{padding:15px}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.charts{grid-template-columns:1fr}.hero{flex-direction:column}.actions{width:100%;justify-content:flex-start}.actions .btn{flex:1}.hrow{grid-template-columns:105px 1fr 38px}}

.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}.step b{display:block;font-size:13px;margin-bottom:4px}.step span{font-size:11px;color:var(--muted)}.kpi.action{border-left:4px solid var(--red)}.kpi.action b{color:var(--red)}.quick-actions{display:flex;gap:9px;flex-wrap:wrap}.btn.outline{background:#fff;color:var(--blue);border:1px solid #cfe0f7}.btn.warn{background:#fff6e8;color:#9a5b00;border:1px solid #f0d39d}.empty{padding:28px;text-align:center;color:var(--muted)}.issue{color:#9a3b00;font-size:11px;line-height:1.45}.mini{font-size:11px;color:var(--muted)}.need-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.need-toolbar select,.need-toolbar input{min-width:170px}.need-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}.need-kpi{padding:14px 16px}.need-kpi b{font-size:25px;display:block;margin-top:4px}.need-row-open td{background:#fffdf8}.need-row-done td{background:#f8fcf9}.priority{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:800}.priority.high{background:#fff0ef;color:#b42318}.priority.med{background:#fff6e8;color:#9a5b00}.priority.low{background:#eef5ff;color:#175fc3}.modal-backdrop{position:fixed;inset:0;background:#0b1f3a66;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal{width:min(720px,100%);background:#fff;border-radius:20px;box-shadow:0 25px 80px #0b1f3a40;padding:22px}.modal h2{margin:0 0 5px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.detail{background:#f8fafc;border:1px solid var(--line);padding:10px 12px;border-radius:12px}.detail small{display:block;color:var(--muted);margin-bottom:4px}.modal textarea{width:100%;min-height:100px;padding:12px;border:1px solid #d6dfeb;border-radius:12px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}@media(max-width:800px){.need-kpis{grid-template-columns:1fr 1fr}.modal-grid{grid-template-columns:1fr}}
</style><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);let me=null,state={tab:'dashboard'};
async function api(url,opt={}){opt.credentials='include';opt.headers={...(opt.headers||{})};const r=await fetch(url,opt);if(r.status===401){me=null;renderLogin();throw Error('Phiên đăng nhập đã hết hạn')}if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.error||'Có lỗi xảy ra')}return r}
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function renderLogin(){document.body.innerHTML=`<div class="login-page"><div class="login-card"><div class="login-head"><div class="logo">UFLS</div><div class="org">TRƯỜNG ĐẠI HỌC NGOẠI NGỮ</div><div class="org">ĐẠI HỌC ĐÀ NẴNG</div><div class="title">Dashboard theo dõi XLDV 2026</div><div class="sub">Hệ thống theo dõi, đối soát và báo cáo kết quả xếp lớp tiếng Anh đầu vào</div></div><div class="login-body"><div class="field"><label>Tên đăng nhập</label><input id="u" class="input" placeholder="Nhập tên đăng nhập" value="admin"></div><div class="field"><label>Mật khẩu</label><div class="password"><input id="p" class="input" type="password" placeholder="Nhập mật khẩu" value="admin123"><button class="eye" onclick="togglePass()">◉</button></div></div><button class="btn login-btn" onclick="login()">Đăng nhập</button><div class="or">hoặc</div><button class="btn sso" onclick="toast('SSO ĐHĐN sẽ được kết nối trong môi trường triển khai chính thức')">🛡 &nbsp;Đăng nhập SSO (ĐHĐN)</button><div class="demo">Demo: admin/admin123 · bgh/bgh123 · dhspkt/dhspkt123</div></div><div class="footer">© 2026 Trường Đại học Ngoại ngữ – Đại học Đà Nẵng</div></div></div>`}
function togglePass(){const p=$('#p');p.type=p.type==='password'?'text':'password'}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const d=await r.json();if(!r.ok)throw Error(d.error);me=d.user;await boot()}catch(e){toast(e.message)}}
async function boot(){try{me=await (await api('/api/me')).json();renderShell();loadDashboard()}catch{renderLogin()}}
function renderShell(){document.body.innerHTML=`<div class="app"><header class="topbar"><div class="brandbox"><div class="brandmark">UFLS</div><div><div class="brandname">XLDV 2026</div><div class="brandsub">Theo dõi xếp lớp đầu vào tiếng Anh · ĐHĐN</div></div></div><div class="userbox"><span class="pill">${me.role}${me.school?' · '+me.school:''}</span><div class="avatar">${(me.username||'U')[0].toUpperCase()}</div></div></header><main class="main"><div class="hero"><div><h1>${state.tab==='dashboard'?'Tổng quan hệ thống':state.tab==='students'?'Danh sách & đối soát':state.tab==='needs'?'Cần xử lý':'Tra log hệ thống'}</h1><div class="muted">ĐHNN quản lý và cập nhật dữ liệu · MSSV là khóa đối soát chính · Dashboard nội bộ</div></div><div class="actions"><button class="btn secondary" onclick="exportReport()">📊 Xuất báo cáo tất cả CSGD</button><button class="btn secondary" onclick="doExport()">↗ Xuất CSV</button>${me.role==='ADMIN'?'<button class="btn secondary" onclick="importExcel()">＋ ĐHNN nhập Excel</button>':''}<button class="btn danger" onclick="logout()">Đăng xuất</button></div></div><div class="nav"><button class="btn ${state.tab==='dashboard'?'active':''}" onclick="setTab('dashboard')">Tổng quan</button><button class="btn ${state.tab==='students'?'active':''}" onclick="setTab('students')">Danh sách & đối soát</button><button class="btn ${state.tab==='needs'?'active':''}" onclick="setTab('needs')">⚠ Cần xử lý</button>${['ADMIN','BGH'].includes(me.role)?`<button class="btn ${state.tab==='audit'?'active':''}" onclick="setTab('audit')">Tra log</button>`:''}</div><div id="content"></div></main></div>`;openEvents()}
function filters(){return `<div class="panel filters"><input id="fsearch" class="input" placeholder="Tìm MSSV / họ tên / ngành"><input id="fschool" class="input" placeholder="CSGDĐHTV"><input id="fcohort" class="input" placeholder="Khóa"><input id="fmajor" class="input" placeholder="Ngành"><select id="flevel"><option value="">Mức</option><option>A2.1</option><option>A2.2</option><option>B1.1</option><option>B1.2</option></select><select id="fmethod"><option value="">Phương án</option><option>PA1</option><option>PA2</option><option>PA3</option></select><select id="falert"><option value="">Cảnh báo</option><option value="1">Có cảnh báo</option></select><button class="btn" onclick="reload()">Lọc</button></div>`}
function qs(){const x=new URLSearchParams();[['search','fsearch'],['school','fschool'],['cohort','fcohort'],['major','fmajor'],['level','flevel'],['method','fmethod'],['alert','falert']].forEach(([a,b])=>{const v=$('#'+b)?.value;if(v)x.set(a,v)});return x}
async function loadDashboard(){const c=$('#content');c.innerHTML=filters()+`<div id="dash"></div>`;try{const d=await (await api('/api/dashboard?'+qs())).json();$('#dash').innerHTML=`<div class="workflow"><div class="step"><b>1 · Nhập dữ liệu</b><span>ĐHNN nhập Excel một lần</span></div><div class="step"><b>2 · Tự động đối soát</b><span>Hệ thống tính PA2/PA3 theo quy tắc</span></div><div class="step"><b>3 · Tự phát hiện</b><span>Cảnh báo và lập danh sách cần xử lý</span></div><div class="step"><b>4 · Xuất báo cáo</b><span>Đối soát, cần xử lý, tổng hợp</span></div></div><div class="grid"><div class="panel kpi"><div class="ico">👥</div><div class="muted">Tổng sinh viên</div><b>${d.kpi.total}</b></div><div class="panel kpi"><div class="ico">✓</div><div class="muted">Đã xác định mức</div><b>${d.kpi.determined}</b></div><div class="panel kpi action"><div class="ico">⚠</div><div class="muted">Cần ĐHNN xử lý</div><b>${d.kpi.needsAction}</b></div><div class="panel kpi"><div class="ico">🎯</div><div class="muted">Có kết quả PA3</div><b>${d.kpi.pa3Result}</b></div></div><div class="panel" style="padding:15px;margin:15px 0"><div class="quick-actions"><button class="btn" onclick="exportReconciliation()">📥 Xuất file Đối soát</button><button class="btn warn" onclick="exportNeeds()">⚠ Xuất file Cần xử lý</button><button class="btn outline" onclick="exportReport()">📊 Báo cáo tất cả CSGD</button></div><div class="mini" style="margin-top:8px">Hệ thống tự tính và tự lập danh sách từ dữ liệu Dashboard; ĐHNN chỉ cần xử lý các trường hợp có cảnh báo hoặc thiếu thông tin cần xác minh.</div></div><div class="section-title"><div><h2>Phân tích kết quả</h2><div class="muted">Số liệu cập nhật trực tiếp từ dữ liệu đã đối soát.</div></div></div><div class="charts"><div class="panel chart"><div class="chart-head"><div><h3>Phân lớp cuối cùng</h3><div class="muted">Số sinh viên theo mức xếp lớp</div></div></div>${chart(d.levels)}</div><div class="panel chart"><h3>Phương án sử dụng</h3><div class="muted">Số sinh viên theo PA1/PA2/PA3</div>${chart(d.methods)}</div><div class="panel chart"><h3>Kết quả thi PA3</h3><div class="muted">Số sinh viên theo mức kết quả kiểm tra</div>${chart(d.pa3Levels)}</div><div class="panel chart"><h3>Phân bố điểm thi PA3</h3><div class="muted">Số sinh viên theo khoảng điểm</div>${chart(d.pa3Bands)}</div></div><div class="section-title"><div><h2>Tiến độ theo cơ sở đào tạo</h2><div class="muted">Tự động tổng hợp từ dữ liệu đã nhập.</div></div></div><div class="panel chart" style="margin-bottom:14px"><div class="chart-head"><div><h3>So sánh kết quả theo CSGDĐHTV</h3><div class="muted">Tổng sinh viên, đã xác định mức và có kết quả PA3</div></div></div>${schoolChart(d.schools)}</div><div class="panel" style="padding:16px;margin-bottom:14px"><h3 style="margin-top:0">Bảng tiến độ chi tiết</h3><div class="tableWrap"><table class="table"><thead><tr><th>CSĐT</th><th>Tổng SV</th><th>Đã xác định</th><th>PA3</th><th>Cần xử lý</th><th>Tiến độ</th></tr></thead><tbody>${d.schools.map(x=>`<tr><td><b>${x.school}</b></td><td>${x.total}</td><td>${x.determined}</td><td>${x.pa3}</td><td>${x.needsAction?`<span class="pill alert">${x.needsAction}</span>`:'<span class="pill ok">0</span>'}</td><td><span class="status ${x.progress>=90?'ok':''}">${x.progress}%</span></td></tr>`).join('')}</tbody></table></div></div><div class="panel" style="padding:16px"><b>Quản trị dữ liệu:</b> <span class="status ok">Chỉ ĐHNN cập nhật Dashboard</span><div class="muted" style="margin-top:7px">CSĐT phối hợp cung cấp/xác nhận dữ liệu qua biểu mẫu; không sửa trực tiếp Dashboard. ${d.reportRule}</div><div class="muted" style="margin-top:7px">Cập nhật máy chủ: ${new Date(d.serverTime).toLocaleString('vi-VN')}</div></div>`}catch(e){c.innerHTML='<div class="panel" style="padding:20px">'+e.message+'</div>'}}
function chart(a){if(!a.length)return '<div class="muted">Chưa có dữ liệu</div>';const max=Math.max(...a.map(x=>Number(x.value)||0),1);const total=a.reduce((n,x)=>n+(Number(x.value)||0),0);return `<div class="chart-total">Tổng: <b>${total}</b></div><div class="bar">${a.map(x=>`<i title="${x.label}: ${x.value}" style="height:${Math.max(10,(Number(x.value)||0)/max*175)}px"><em>${x.value}</em><span>${x.label}</span></i>`).join('')}</div>`}
function schoolChart(a){if(!a.length)return '<div class="muted">Chưa có dữ liệu</div>';const max=Math.max(...a.map(x=>Number(x.total)||0),1);return `<div class="hbars">${a.map(x=>`<div class="hrow"><div class="hlabel" title="${x.school}">${x.school}</div><div class="track"><div class="fill" style="width:${Math.max(2,(Number(x.total)||0)/max*100)}%"></div></div><div class="hval">${x.total}</div></div>`).join('')}</div><div class="legend">${a.map(x=>`<span class="pill">${x.school}: ${x.determined}/${x.total} đã xác định · Cần xử lý ${x.needsAction}</span>`).join('')}</div>`}

   let base=('KQ_'+school).replace(/[\\/?*\[\]:]/g,' ').replace(/\s+/g,' ').trim()||('KQ_'+(idx+1));
   base=base.slice(0,31);let name=base,n=2;while(used.has(name)){name=(base.slice(0,28)+'_'+n++).slice(0,31)}used.add(name);
   const sh=XLSX.utils.json_to_sheet(detailRows(schoolRows));addStyled(name,sh);XLSX.utils.book_append_sheet(wb,sh,name);
  });
  XLSX.writeFile(wb,'Bao_cao_XLDV_2026_TAT_CA_CSGD.xlsx');
  toast(`Đã xuất báo cáo toàn bộ ${Object.keys(bySchool).length} CSGD · ${rows.length} sinh viên`);
 }catch(e){toast(e.message)}
}
async function doExport(){try{const rows=await getReportRows();const cols=['mssv','full_name','school','cohort','major','pa1_level','pa2_score','pa2_level','pa3_score','pa3_level','best_level','method','status','alerts'];const csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(Array.isArray(r[k])?r[k].join('; '):r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'bao_cao_xldv_2026.csv');toast('Đã xuất báo cáo CSV')}catch(e){toast(e.message)}}
function importExcel(){const i=document.createElement('input');i.type='file';i.accept='.xlsx';i.onchange=async()=>{try{if(!window.XLSX)throw Error('Chưa tải thư viện Excel');const data=await i.files[0].arrayBuffer();const wb=XLSX.read(data);const ws=wb.Sheets['NHAP_DANH_SACH'];if(!ws)throw Error('Thiếu sheet NHAP_DANH_SACH');const base=XLSX.utils.sheet_to_json(ws,{defval:''});let results={};const kq=wb.Sheets['KQ_PA1'];if(kq)for(const r of XLSX.utils.sheet_to_json(kq,{defval:''})){if(r.MSSV)results[String(r.MSSV).trim()]=r;}const rows=base.map(r=>{const kr=results[String(r.MSSV||'').trim()]||{};return {mssv:String(r.MSSV||'').trim(),full_name:r['Họ và tên'],school:r['CSGDĐHTV'],cohort:r['Khóa'],major:r['Ngành'],pa2_score:r['Điểm THPT'],pa3_score:kr['Điểm PA1'],pa3_source:kr['Điểm PA1']!==undefined?'KQ_PA1 (nguồn legacy → PA3)':'PA3',registration_pa1:r['Đăng ký PA1'],registration_pa3:r['Đăng ký PA3']||r['PA3 đăng ký']||r['Đăng ký PA3?']||'',note:r['Ghi chú']};}).filter(r=>r.mssv);const r=await api('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});const d=await r.json();if(!r.ok)throw Error(d.error);toast(`Đã nhập ${d.rows} dòng · hệ thống đã tự đối soát${d.duplicates?.length?` · ${d.duplicates.length} MSSV trùng trong file`:''}`);if(d.duplicates?.length)console.warn('MSSV trùng trong file:',d.duplicates);reload()}catch(e){toast(e.message)}};i.click()}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}me=null;renderLogin()}function openEvents(){}boot();
